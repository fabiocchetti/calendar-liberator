<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalendarLiberator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="icons/icon-32.png" alt="" width="22" height="22">
            <h1>CalendarLiberator</h1>
        </div>

        <div class="controls">
            <div class="form-group">
                <label for="calendarName">Calendar Name</label>
                <input type="text" id="calendarName" class="calendar-name-input" placeholder="Auto-detected from Outlook" maxlength="100">
            </div>

            <div class="form-group">
                <label for="timezone">Calendar Timezone</label>
                <select id="timezone" class="timezone-select">
                    <option value="UTC-12">UTC-12</option>
                    <option value="UTC-11">UTC-11</option>
                    <option value="UTC-10">UTC-10</option>
                    <option value="UTC-9">UTC-9</option>
                    <option value="UTC-8">UTC-8</option>
                    <option value="UTC-7">UTC-7</option>
                    <option value="UTC-6">UTC-6</option>
                    <option value="UTC-5">UTC-5</option>
                    <option value="UTC-4">UTC-4</option>
                    <option value="UTC-3">UTC-3</option>
                    <option value="UTC-2">UTC-2</option>
                    <option value="UTC-1">UTC-1</option>
                    <option value="UTC+0" selected>UTC+0</option>
                    <option value="UTC+1">UTC+1</option>
                    <option value="UTC+2">UTC+2</option>
                    <option value="UTC+3">UTC+3</option>
                    <option value="UTC+4">UTC+4</option>
                    <option value="UTC+5">UTC+5</option>
                    <option value="UTC+6">UTC+6</option>
                    <option value="UTC+7">UTC+7</option>
                    <option value="UTC+8">UTC+8</option>
                    <option value="UTC+9">UTC+9</option>
                    <option value="UTC+10">UTC+10</option>
                    <option value="UTC+11">UTC+11</option>
                    <option value="UTC+12">UTC+12</option>
                </select>
            </div>

            <div class="form-group">
                <label>Event Options</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeDeclined">
                        <span>Include declined</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeOOO">
                        <span>Include out-of-office</span>
                    </label>
                </div>
            </div>

            <button id="exportButton" class="export-btn">
                Export to ICS
            </button>
        </div>

        <div id="status" class="status-section">
            <div class="status-content">
                <div class="status-text">Ready to Export</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
