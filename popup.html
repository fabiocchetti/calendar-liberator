<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Liberator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="header">
        <img src="icon-48.png" alt="" width="36" height="36">
        <h1 class="wordmark">Calendar Liberator</h1>
    </header>

    <!-- Ready state: on an Outlook page -->
    <main id="readyState" hidden>
        <div class="field">
            <label for="calendarName">Calendar name</label>
            <input type="text" id="calendarName" placeholder="Auto-detected from Outlook" maxlength="100">
        </div>

        <div class="field">
            <label for="timezone">Timezone</label>
            <select id="timezone">
                <option value="UTC-12">UTC-12</option>
                <option value="UTC-11">UTC-11</option>
                <option value="UTC-10">UTC-10 · Pacific/Honolulu</option>
                <option value="UTC-9">UTC-9 · America/Anchorage</option>
                <option value="UTC-8">UTC-8 · America/Los_Angeles</option>
                <option value="UTC-7">UTC-7 · America/Denver</option>
                <option value="UTC-6">UTC-6 · America/Chicago</option>
                <option value="UTC-5">UTC-5 · America/New_York</option>
                <option value="UTC-4">UTC-4 · America/Halifax</option>
                <option value="UTC-3">UTC-3 · America/Buenos_Aires</option>
                <option value="UTC-2">UTC-2</option>
                <option value="UTC-1">UTC-1 · Atlantic/Azores</option>
                <option value="UTC+0" selected>UTC+0 · Europe/London</option>
                <option value="UTC+1">UTC+1 · Europe/Rome</option>
                <option value="UTC+2">UTC+2 · Europe/Helsinki</option>
                <option value="UTC+3">UTC+3 · Europe/Moscow</option>
                <option value="UTC+4">UTC+4 · Asia/Dubai</option>
                <option value="UTC+5">UTC+5 · Asia/Karachi</option>
                <option value="UTC+6">UTC+6 · Asia/Dhaka</option>
                <option value="UTC+7">UTC+7 · Asia/Bangkok</option>
                <option value="UTC+8">UTC+8 · Asia/Singapore</option>
                <option value="UTC+9">UTC+9 · Asia/Tokyo</option>
                <option value="UTC+10">UTC+10 · Australia/Sydney</option>
                <option value="UTC+11">UTC+11 · Pacific/Noumea</option>
                <option value="UTC+12">UTC+12 · Pacific/Auckland</option>
            </select>
        </div>

        <div class="field">
            <span class="field-label">Event options</span>
            <label class="check">
                <input type="checkbox" id="includeDeclined">
                <span class="box" aria-hidden="true"></span>
                <span>Include declined</span>
            </label>
            <label class="check">
                <input type="checkbox" id="includeOOO">
                <span class="box" aria-hidden="true"></span>
                <span>Include out-of-office</span>
            </label>
        </div>

        <button id="exportButton" class="primary">Export .ics</button>
        <p id="errorText" class="error" hidden></p>
    </main>

    <!-- Empty state: outside Outlook -->
    <main id="emptyState" class="empty" hidden>
        <img src="icon-128.png" alt="" width="64" height="64">
        <h2>No calendar here</h2>
        <p>It works on the Outlook calendar page.</p>
        <a href="https://outlook.office.com/calendar" id="openOutlook">Open Outlook Calendar →</a>
    </main>

    <script src="popup.js"></script>
</body>
</html>
