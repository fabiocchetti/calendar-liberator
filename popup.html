<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Liberator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="header">
        <img src="icons/icon-48.png" alt="" width="36" height="36">
        <h1 class="wordmark">Calendar Liberator</h1>
    </header>

    <!-- Ready state: on an Outlook page -->
    <main id="readyState" hidden>
        <div class="field">
            <label for="calendarName">Calendar name</label>
            <input type="text" id="calendarName" placeholder="Auto-detected from Outlook" maxlength="100">
        </div>

        <div class="field">
            <label for="timezone">Timezone</label>
            <!-- Values are real IANA zones: a bare "UTC+1" is ambiguous with
                 respect to DST. Labels get the current offset appended by popup.js. -->
            <select id="timezone">
                <option value="Etc/GMT+12">Etc/GMT+12</option>
                <option value="Etc/GMT+11">Etc/GMT+11</option>
                <option value="Pacific/Honolulu">Pacific/Honolulu</option>
                <option value="America/Anchorage">America/Anchorage</option>
                <option value="America/Los_Angeles">America/Los_Angeles</option>
                <option value="America/Denver">America/Denver</option>
                <option value="America/Chicago">America/Chicago</option>
                <option value="America/New_York">America/New_York</option>
                <option value="America/Halifax">America/Halifax</option>
                <option value="America/Argentina/Buenos_Aires">America/Argentina/Buenos_Aires</option>
                <option value="Etc/GMT+2">Etc/GMT+2</option>
                <option value="Atlantic/Azores">Atlantic/Azores</option>
                <option value="Europe/London" selected>Europe/London</option>
                <option value="Europe/Rome">Europe/Rome</option>
                <option value="Europe/Helsinki">Europe/Helsinki</option>
                <option value="Europe/Moscow">Europe/Moscow</option>
                <option value="Asia/Dubai">Asia/Dubai</option>
                <option value="Asia/Karachi">Asia/Karachi</option>
                <option value="Asia/Dhaka">Asia/Dhaka</option>
                <option value="Asia/Bangkok">Asia/Bangkok</option>
                <option value="Asia/Singapore">Asia/Singapore</option>
                <option value="Asia/Tokyo">Asia/Tokyo</option>
                <option value="Australia/Sydney">Australia/Sydney</option>
                <option value="Pacific/Noumea">Pacific/Noumea</option>
                <option value="Pacific/Auckland">Pacific/Auckland</option>
            </select>
        </div>

        <div class="field">
            <span class="field-label">Event options</span>
            <label class="check">
                <input type="checkbox" id="includeDeclined">
                <span class="box" aria-hidden="true"></span>
                <span>Include declined</span>
            </label>
            <label class="check">
                <input type="checkbox" id="includeOOO">
                <span class="box" aria-hidden="true"></span>
                <span>Include out-of-office</span>
            </label>
        </div>

        <button id="exportButton" class="primary">Export .ics</button>
        <p id="errorText" class="error" hidden></p>
    </main>

    <!-- Empty state: outside Outlook -->
    <main id="emptyState" class="empty" hidden>
        <img src="icons/icon-128.png" alt="" width="64" height="64">
        <h2>No calendar here</h2>
        <p>It works on the Outlook calendar page.</p>
        <a href="https://outlook.office.com/calendar" id="openOutlook">Open Outlook Calendar →</a>
    </main>

    <script src="popup.js"></script>
</body>
</html>
